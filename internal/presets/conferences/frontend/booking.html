<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Конференции.РФ — Заявка</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="brand-header">
        <h1>Оформление заявки</h1>
        <p>Бронирование помещения</p>
      </header>
      <div class="card-panel">
        <div id="booking-alert" class="alert alert-inline d-none"></div>
        <form id="booking-form">
          <div class="mb-3">
            <label class="form-label">Тип помещения</label>
            <select class="form-select" name="room_type" required>
              <option value="">Выберите...</option>
              <option value="аудитория">Аудитория</option>
              <option value="коворкинг">Коворкинг</option>
              <option value="кинозал">Кинозал</option>
            </select>
            <div id="room_type-hint" class="form-hint"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Дата начала (ДД.ММ.ГГГГ)</label>
            <input
              class="form-control"
              name="start_date"
              placeholder="01.06.2026"
              pattern="\d{2}\.\d{2}\.\d{4}"
              required
            />
            <div id="start_date-hint" class="form-hint"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Способ оплаты</label>
            <select class="form-select" name="payment_method" required>
              <option value="">Выберите...</option>
              <option value="наличные">Наличные</option>
              <option value="банковская карта">Банковская карта</option>
              <option value="безналичный расчёт">Безналичный расчёт</option>
            </select>
            <div id="payment_method-hint" class="form-hint"></div>
          </div>
          <button type="submit" class="btn btn-brand w-100">Отправить заявку</button>
        </form>
        <a class="nav-link-soft" href="/cabinet.html">Личный кабинет</a>
      </div>
    </div>
    <script type="module" src="/src/pages/booking.js"></script>
  </body>
</html>
